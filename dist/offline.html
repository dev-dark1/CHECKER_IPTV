<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <title>CHECKER IPTV Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #02040a;
        color: #f8fafc;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, rgba(18, 217, 255, 0.16), transparent 30%),
          radial-gradient(circle at 80% 80%, rgba(57, 255, 136, 0.1), transparent 34%),
          #02040a;
      }

      main {
        width: min(92vw, 520px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.42);
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 26px 90px rgba(0, 0, 0, 0.44);
        backdrop-filter: blur(20px);
      }

      p {
        color: #94a3b8;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CHECKER IPTV</h1>
      <p>The app shell is offline. Live IPTV streams need a working network connection.</p>
    </main>
  </body>
</html>
